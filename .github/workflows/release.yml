name: release

# A v* tag builds the Windows installer and portable zip (the same build and
# smoke tests as CI, windows-build.yml) and creates a DRAFT GitHub release
# with SHA256SUMS.txt and the CHANGELOG.md notes for that version. Drafts are
# not public; a person publishes the draft after checking it.
# Public repo: GitHub-hosted runners only, never self-hosted.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag, the changelog entry, CI and that the commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # checks: read lets this job read the commit's CI results; nothing else
    # in the release needs it.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag matches the source version and has a dated CHANGELOG section
        run: |
          version=$(python3 packaging/buildinfo.py check-tag "$TAG")
          python3 packaging/buildinfo.py release-notes "$version" > /dev/null
        env:
          TAG: ${{ github.ref_name }}
      # A guard against mistakes (tagging a branch commit), not against
      # someone with push rights: this file comes from the tagged commit.
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # ci.yml's push run on main must have finished green for this exact
      # commit; missing, running or failed checks stop the release.
      - name: CI passed on the tagged commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" > check-runs.json
          python3 packaging/buildinfo.py check-ci check-runs.json
        env:
          GH_TOKEN: ${{ github.token }}

  # Not named "Windows build": its check run must not look like CI's.
  build:
    name: Release build
    needs: check
    uses: ./.github/workflows/windows-build.yml
    with:
      release-tag: ${{ github.ref_name }}

  draft:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token, and it runs no build code: it hashes
    # the files the build job uploaded and creates the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: transcription-flow-windows-${{ github.sha }}
          path: release
      # The exact file names also prove the build used the tag's version.
      # The tag must still point at the commit that was built.
      - name: SHA256SUMS.txt, then a draft release with the CHANGELOG notes (never published here)
        run: |
          version=$(python3 packaging/buildinfo.py tag-version "$TAG")
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at $tag_sha, not at the built commit $GITHUB_SHA"
            exit 1
          fi
          prerelease=()
          case "$version" in *a*|*b*|*rc*) prerelease=(--prerelease) ;; esac
          (cd release && sha256sum "TranscriptionFlow-Setup-$version.exe" "TranscriptionFlow-$version-portable.zip" > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          python3 packaging/buildinfo.py release-notes "$version" > notes.md
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "Transcription Flow $version" --notes-file notes.md \
            "release/TranscriptionFlow-Setup-$version.exe" \
            "release/TranscriptionFlow-$version-portable.zip" \
            release/SHA256SUMS.txt
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
